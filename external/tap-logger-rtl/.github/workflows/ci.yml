# Written from the exact commands that were run locally in a fresh virtualenv; it has not been executed on GitHub.
name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y iverilog yosys verilator g++ make
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python tools/mutate_rtl.py

# Runs on every push, so anyone can see the checks pass without running anything themselves.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      external:
        description: "Also run the 13 vendored repositories' own test suites (about 15 minutes)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: CPU torch on one Python, so the GPU code path is rehearsed (tests/test_hw_rehearsal.py)
        if: matrix.python == '3.12'
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[test]"
      - run: pytest
      - run: closure selftest
      - run: closure claims
      - run: closure coverage
      - run: closure pause claims
      - run: closure pause coverage
      - run: closure treaty coverage
      - run: closure treaty asi-tables
      - name: vendored repositories are the trees that were tested
        run: closure external check
      - run: closure hw-probe --mock --out probe.json
      - run: closure sim-trial --profile smoke --out run --probe probe.json && closure verify run
      - name: Tier 0 pilot on a simulated GPU
        run: closure tier0 --mock --skip-tests --out runs/tier0

  evidence:
    # What a reader can see without running anything. This job's summary page (Actions > a run > Summary) shows the
    # table of hardware runs, re-derived on GitHub's machine from the bundles published under results/, and the pilot
    # run end to end on a simulated GPU by the same one command a reader would use (scripts/run_anywhere.sh). The
    # simulated pilot's bundle is attached to the run as an artifact.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: one command from a fresh clone (the pilot on a simulated GPU; no physical claim)
        run: bash scripts/run_anywhere.sh --skip-tests --out runs/mock
      - name: the published bundles, re-read (hashes, signatures, and every number the documents quote)
        run: .venv/bin/python -m pytest -q tests/test_runs_on_record.py
      - name: summary page
        run: |
          {
            .venv/bin/python results/record.py
            echo
            echo "## Efficiency slack left under each rule a regime could adopt (results/SLACK_LEFT.md; decides nothing)"
            echo
            .venv/bin/python results/slack_left.py > slack_left.md
            sed -n '/^## 2\./,/^## 3\./p' slack_left.md | sed '$d'
            sed -n '/^## What these numbers say/,/^## What they do not say/p' slack_left.md | sed '$d'
            echo
            echo "## This runner, as \`closure doctor\` reads it"
            echo
            .venv/bin/python -m closure.cli doctor | sed -n '3,8p'
            echo
            echo "## The pilot on a simulated GPU, run here by \`bash scripts/run_anywhere.sh\` (no physical claim)"
            echo
            sed -n '3,16p' runs/mock/SUMMARY.md
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: simulated-pilot-bundle
          path: |
            runs/mock/tier0_bundle.tar.gz
            runs/mock/SUMMARY.md
            runs/mock/doctor.md

  external-suites:
    if: github.event_name == 'workflow_dispatch' && inputs.external
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: tools some vendored tests need (RTL simulators, packet capture)
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends iverilog verilator yosys tshark tcpdump iproute2
      - name: install (CPU torch for cuda-guard's tests)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[hw,external]"
      - run: closure external test --install

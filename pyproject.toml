[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "plan-a-closure"
version = "0.5.1"
description = "Compute material-balance accounting (energy, time, traffic, state closure) for inference-only AI verification; pre-registered builder-vs-breaker trial kit."
requires-python = ">=3.10"
dependencies = ["numpy>=1.22", "cryptography>=41"]
license = { text = "Apache-2.0" }

[project.optional-dependencies]
hw = ["nvidia-ml-py>=12", "torch"]  # nvidia-ml-py provides the pynvml module; the pynvml package is deprecated
test = ["pytest>=7"]
# Everything the suites under external/ need (`closure external test`). cuda-guard's tests also import torch (the hw
# extra); its nv-attestation-sdk is left out because it only matters on a confidential-computing GPU.
external = ["pytest>=8", "pytest-timeout>=2", "hypothesis>=6", "scipy>=1.11", "mpmath>=1.3", "blake3>=0.4.1",
            "pydantic>=2.6", "fastapi>=0.110", "uvicorn>=0.27", "typer>=0.12", "httpx>=0.27", "requests>=2.31",
            "urllib3>=2", "psycopg2-binary", "pandas>=2", "rapidfuzz>=3", "openpyxl>=3.1", "scikit-learn", "matplotlib",
            "networkx", "jsonschema", "pymerkle>=6,<7", "scapy>=2.5", "opentelemetry-sdk>=1.40", "opentelemetry-api>=1.40"]

[project.scripts]
closure = "closure.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["external", "runs", ".*", "*.egg", "build", "dist", "venv", "node_modules"]  # external/ has its own suites

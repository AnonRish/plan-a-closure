[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cuda-guard"
version = "0.1.0"
description = "AI 2040 compute-verification architecture -- real-evidence implementation"
requires-python = ">=3.9"
dependencies = [
    "torch",
    "nvidia-ml-py",
    "nv-attestation-sdk",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
cuda-guard = "cuda_guard.cli:main"

[tool.setuptools.packages.find]
include = ["cuda_guard*"]
